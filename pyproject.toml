[tool.pytest.ini_options]
testpaths = ["tests", "week5"]
pythonpath = [".", "week5"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"week5/legacy_fees.py" = ["ALL"]

[tool.pylint.main]
py-version = "3.12"
fail-under = 9.0

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "too-many-instance-attributes"]
